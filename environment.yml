name: hajj-drone
channels:
  - conda-forge
dependencies:
  - python>=3.11
  # Core analysis
  - pandas>=2.0
  - numpy>=1.24
  # Geospatial (conda-forge builds avoid the GDAL/PROJ pain of pip)
  - geopandas>=0.14
  - shapely>=2.0
  # Figures and maps
  - matplotlib>=3.7
  - folium>=0.15
  - contextily>=1.4
  # Optimization: only needed to re-solve the models
  - pyomo>=6.7
  # Notebooks (optional)
  - jupyterlab>=4.0
  - pip
  - pip:
      - highspy>=1.5
