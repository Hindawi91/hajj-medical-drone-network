# Confirms that a clean clone reproduces every number in the paper, and that the
# reported solutions still satisfy every model constraint.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # verify_results.py needs only pandas and numpy: no geospatial stack,
      # no solver, no network.
      - name: Install minimal dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Verify results match the paper
        run: python src/verify_results.py

      - name: Validate the solutions independently
        run: python src/validate_solutions.py
